name: English documentation

on:
  push:
    branches: [docs-pages]
  pull_request:
    branches: [docs-pages]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source:
    name: Select the documentation package source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.source.outputs.candidate }}
      ref: ${{ steps.source.outputs.ref }}
      commit: ${{ steps.source.outputs.commit }}
      run_id: ${{ steps.source.outputs.run_id }}
      artifact: ${{ steps.source.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.17"
      - name: Require a pinned release or a PR-only verified CI bundle
        id: source
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          target = json.loads(Path("documentation/target.json").read_text())
          version = target["version"]
          source = target["source_commit"]
          tag = "v" + version
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version)
          assert target["status"] in ("candidate", "released")
          assert re.fullmatch("[0-9a-f]{40}", source)
          assert target["expected_release"] == version and target["source_tag"] == tag
          candidate = target["status"] == "candidate"
          output = {"candidate": str(candidate).lower(), "commit": source}
          if candidate:
              assert os.environ["GITHUB_EVENT_NAME"] == "pull_request"
              assert target["publication_allowed"] is False
              ci = target["verified_ci"]
              assert type(ci["run_id"]) is int and ci["run_id"] > 0
              assert type(ci["attempt"]) is int and ci["attempt"] > 0
              output.update(ref=source, run_id=ci["run_id"],
                            artifact=f"release-distributions-{ci['run_id']}-{ci['attempt']}")
          else:
              assert target["publication_allowed"] is True
              output["ref"] = "refs/tags/" + tag
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as receipt:
              for name, value in output.items():
                  receipt.write(f"{name}={value}\n")
          PY

  examples:
    name: Examples / ${{ matrix.profile }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: full, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: core, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: pandas2, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: pandas-current, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: polars-only, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: polars-current, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: optional-exports, python: "3.13.17", runner: macos-15, freethreaded: false}
          - {profile: optional-exports-current, python: "3.13.17", runner: macos-15, freethreaded: false}
          - {profile: public-install, python: "3.13.17", runner: ubuntu-24.04, freethreaded: false}
          - {profile: windows-full, python: "3.13.17", runner: windows-2025, freethreaded: false}
          - {profile: nogil314, python: "3.14.10", runner: macos-15, freethreaded: true, abi: cp314t}
          - {profile: nogil315, python: "3.15.2", runner: macos-15, freethreaded: true, abi: cp315t}
          - {profile: inventory312, python: "3.12.10", runner: ubuntu-24.04, freethreaded: false}
          - {profile: inventory314, python: "3.14.10", runner: ubuntu-24.04, freethreaded: false}
          - {profile: inventory315, python: "3.15.2", runner: ubuntu-24.04, freethreaded: false}
    env:
      DOC_PROFILE: ${{ matrix.profile }}
      OMP_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
      XLA_FLAGS: --xla_cpu_multi_thread_eigen=false
    steps:
      - name: Read the exact product source and qualification helper
        if: matrix.freethreaded || matrix.profile == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.ref }}
          persist-credentials: false
          fetch-tags: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: docs-worktree
          persist-credentials: false
      - name: Verify the checkout before using release-source helpers
        if: matrix.freethreaded || matrix.profile == 'full'
        shell: bash
        env:
          PRODUCT_SOURCE: ${{ needs.source.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.source.outputs.candidate == 'true'
        with:
          name: ${{ needs.source.outputs.artifact }}
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: docs-worktree/.local/verified-ci
          digest-mismatch: error
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          freethreaded: ${{ matrix.freethreaded }}
      - name: Install the existing qualification helper's fixed prerequisite
        if: matrix.freethreaded
        run: python -m pip install --disable-pip-version-check packaging==26.3
      - name: Qualify the unchanged official dependency for actual free-threaded tests
        if: matrix.freethreaded
        uses: ./.github/actions/internal-polars-runtime
        with:
          platform-id: macos-arm64
          python-version: ${{ matrix.python }}
          abi-tag: ${{ matrix.abi }}
          interpreter: ${{ env.pythonLocation }}/bin/python
          target: aarch64-apple-darwin
          container: "off"
          manylinux: "off"
      - name: Verify the selected wheel and run all pages for this profile
        shell: bash
        env:
          DOC_CANDIDATE: ${{ needs.source.outputs.candidate }}
        run: |
          source_args=()
          if [[ "$DOC_CANDIDATE" == "true" ]]; then
              source_args+=(--candidate-distributions docs-worktree/.local/verified-ci/dist)
          fi
          python -I docs-worktree/documentation/_tools/ci_profile.py \
            --profile "$DOC_PROFILE" --work docs-worktree/.local/docs-profile \
            --output docs-worktree/.local/docs-export --release-source "$GITHUB_WORKSPACE" "${source_args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-evidence-${{ matrix.profile }}
          path: docs-worktree/.local/docs-export/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build:
    name: Complete documentation gate and checked Pages artifact
    needs: [source, examples]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.pages_name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.17"
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: docs-evidence-*
          path: .local/docs-producers/
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.source.outputs.candidate == 'true'
        with:
          name: ${{ needs.source.outputs.artifact }}
          run-id: ${{ needs.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .local/verified-ci
          digest-mismatch: error
      - name: Assemble only this complete workflow's evidence
        run: >-
          python -I documentation/_tools/assemble_evidence.py
          --input .local/docs-producers --output .local/docs-evidence
          --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Verify the documentation-only source boundary
        run: python -I documentation/_tools/check_source_scope.py --output .local/docs-scope.json
      - name: Build all HTML strictly from the verified public declarations
        run: sphinx-build -d .local/docs-doctrees -b html -E -W --keep-going documentation .local/docs-html
      - name: Verify every visible Python example in the built pages
        run: >-
          python -I documentation/_tools/check_rendered_examples.py
          --html .local/docs-html --output .local/rendered-examples.json
      - name: Require complete entries, scenarios, actual page examples, identities and HTML anchors
        env:
          DOC_CANDIDATE: ${{ needs.source.outputs.candidate }}
        run: |
          mode_args=()
          if [[ "$DOC_CANDIDATE" == "true" ]]; then
              mode_args+=(--allow-candidate)
          fi
          python -I documentation/_tools/check_coverage.py \
            --reports .local/docs-evidence/reports --identity .local/docs-evidence/identity.json \
            --html-dir .local/docs-html --rendered-examples .local/rendered-examples.json \
            --output .local/docs-coverage.json "${mode_args[@]}"
          python -c 'import json; assert not json.load(open(".local/docs-coverage.json"))["pending_case_profiles"]'
      - name: Prepare exact-version, root/latest, 404 and public verification receipts
        env:
          DOC_CANDIDATE: ${{ needs.source.outputs.candidate }}
        run: |
          mode_args=()
          if [[ "$DOC_CANDIDATE" == "true" ]]; then
              mode_args+=(--preview-mode redirect)
          fi
          python -I documentation/_tools/prepare_pages.py \
            --html .local/docs-html --coverage .local/docs-coverage.json \
            --reports .local/docs-evidence/reports --identity .local/docs-evidence/identity.json \
            --receivers .local/docs-evidence/receivers.json --counts .local/docs-evidence/counts.json \
            --output .local/pages --commit "$GITHUB_SHA" \
            --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" "${mode_args[@]}"
      - name: Check actual packaged links, anchors and the public artifact allowlist
        env:
          DOC_CANDIDATE: ${{ needs.source.outputs.candidate }}
        run: |
          mode_args=()
          if [[ "$DOC_CANDIDATE" == "true" ]]; then
              mode_args+=(--preview)
          fi
          python -I documentation/_tools/check_site.py --site .local/pages --output .local/docs-site-check.json "${mode_args[@]}"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.7.0"
      - name: Follow the desktop and narrow-screen reader routes in Chrome
        env:
          DOC_CANDIDATE: ${{ needs.source.outputs.candidate }}
        run: |
          mode_args=()
          if [[ "$DOC_CANDIDATE" == "true" ]]; then
              mode_args+=(--candidate-distributions .local/verified-ci/dist)
          fi
          python -I -B documentation/_tools/reader_runtimes.py \
            --site .local/pages --work .local/docs-browser-runtimes --output .local/reader-runtimes.json "${mode_args[@]}"
          npm install --prefix .local/docs-browser --no-save --no-audit --no-fund playwright-core@1.65.1
          NODE_PATH="$PWD/.local/docs-browser/node_modules" node documentation/_tools/read_routes.cjs \
            .local/pages .local/reader-runtimes.json .local/docs-reader-routes.json "$(command -v google-chrome)"
      - id: pages_name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: ${{ steps.pages_name.outputs.name }}
          path: .local/pages
          retention-days: 30
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-acceptance
          path: |
            .local/docs-coverage.json
            .local/docs-site-check.json
            .local/docs-scope.json
            .local/rendered-examples.json
            .local/docs-evidence/context.json
            .local/docs-evidence/counts.json
            .local/docs-evidence/receivers.json
            .local/docs-reader-routes.json
            .local/docs-evidence/source-tag.json
            .local/docs-evidence/source-sdist.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  acceptance:
    name: Documentation acceptance
    needs: [examples, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXAMPLES_RESULT: ${{ needs.examples.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Require every execution profile and the complete site gate
        run: |
          test "$EXAMPLES_RESULT" = success
          test "$BUILD_RESULT" = success

  deploy:
    name: Publish the checked artifact to GitHub Pages
    needs: [source, build, acceptance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs-pages' && needs.source.outputs.candidate == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
