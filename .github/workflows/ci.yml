name: CI

on:
  push:
    branches: [main]
    # These follow-up records do not change a frozen distribution. Their
    # documentation/demo checks are recorded by the release procedure.
    paths-ignore: ["docs/**", "AGENTS.md", "README.md", "demo/README.md", "demo/runtime.json", "tasks/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [full, pilot]
        default: full
        description: Native verification scope; pilot cannot produce a release bundle.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      profile: ${{ inputs.profile || (github.event_name == 'pull_request' && 'pilot' || 'full') }}
