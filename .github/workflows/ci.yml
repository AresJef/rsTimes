name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [full, pilot]
        default: full
        description: Native verification scope; pilot cannot produce a release bundle.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    # Dedicated research branches use explicit dispatch to avoid duplicate runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(fromJSON('["codex/pldt-nanoseconds-72h-20261030", "codex/native-pyright-nogil-20261103"]'), github.head_ref || github.ref_name)) ||
      (github.event_name == 'pull_request' && github.event.action != 'opened')
    uses: ./.github/workflows/build.yml
    with:
      profile: ${{ inputs.profile || 'full' }}
