name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [full, pilot]
        default: full
        description: Native verification scope; pilot cannot produce a release bundle.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      profile: ${{ inputs.profile || (github.ref == 'refs/heads/codex/pldt-nanoseconds-72h-20261030' && 'pilot') || 'full' }}
