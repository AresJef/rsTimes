name: Publish verified native distributions

# Only an annotated version tag may publish; no compilation occurs here.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: Resolve the already tested CI bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      bundle-name: publication-${{ github.run_id }}-${{ github.run_attempt }}
      metadata-name: publication-metadata-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.17"
      - run: python -m pip install --index-url https://pypi.org/simple packaging==26.3
      - name: Verify tag source, full CI, matrix and local performance receipt
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release_candidate.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: publication-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bundle/release-manifest.json
            bundle/SHA256SUMS
            bundle/performance-receipt.json
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  github-release:
    name: Publish verified files to GitHub
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      bundle-name: ${{ needs.verify.outputs.bundle-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.bundle-name }}
          path: bundle/
      - name: Create or verify this exact GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/github_release.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: github-release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7

  pypi:
    name: Publish the same verified files with OIDC
    needs: github-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.github-release.outputs.bundle-name }}
          path: bundle/
      - name: Verify downloaded and any existing PyPI files
        run: |
          cd bundle
          sha256sum --check SHA256SUMS
          python3 - <<'PYCODE'
          import json, urllib.error, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('release-manifest.json').read_text())
          expected = {row['filename']: row['sha256'] for row in manifest['wheels'] + manifest['sdists']}
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/rsTimes/' + manifest['version'] + '/json') as response:
                  current = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              for row in current['urls']:
                  assert row['filename'] in expected and row['digests']['sha256'] == expected[row['filename']], row['filename']
          PYCODE
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: bundle/dist/
          attestations: true
          skip-existing: true

  pypi-install:
    name: PyPI install / ${{ matrix.platform.id }} / ${{ matrix.python.minor }}
    needs: [verify, pypi]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    env:
      TZ: UTC
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.platform.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.verify.outputs.metadata-name }}
          path: bundle/
      - name: Download and verify public wheel on native desktop
        if: runner.os != 'Linux'
        run: python -I -B tools/download_public.py --platform-id "${{ matrix.platform.id }}" --python-minor "${{ matrix.python.minor }}"
      - name: Download and verify public wheel in matching Linux libc
        if: runner.os == 'Linux'
        run: |
          abi_tag="cp${{ matrix.python.minor }}"
          abi_tag="${abi_tag//./}"
          docker run --rm --volume "$PWD:/project" --workdir /project \
            --env TZ=UTC --env PYTHONUTF8=1 \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/project "${{ matrix.platform.container }}" \
            "/opt/python/${abi_tag}-${abi_tag}/bin/python" -I -B tools/download_public.py \
            --platform-id "${{ matrix.platform.id }}" --python-minor "${{ matrix.python.minor }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pypi-install-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform.id }}-${{ matrix.python.minor }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
