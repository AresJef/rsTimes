name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY
      - name: Install test and build tools
        run: python -m pip install --index-url https://pypi.org/simple -e ".[test]" build twine
      - name: Test
        run: python -m pytest
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Smoke test the installed wheel
        run: |
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --no-deps dist/*.whl
          .wheel-test/bin/python -I -c 'from rstimes import from_unix_ms, to_unix_ms; assert to_unix_ms(from_unix_ms(-1)) == -1; assert from_unix_ms(0).isoformat() == "1970-01-01T00:00:00+00:00"'
      - name: Upload only this run's distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Publish using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
