name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if "+" in version:
              raise SystemExit("Local Delta candidates cannot be published; choose a public version first")
          cargo_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if cargo_version != version:
              raise SystemExit("Cargo and Python package versions differ")
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check native code
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked --lib
          cargo test --release --locked --lib
      - name: Install locked build tools
        run: python -m pip install --index-url https://pypi.org/simple maturin==1.15.0 twine==7.0.0
      - name: Build locked release wheel and source distribution
        run: |
          maturin build --release --locked --interpreter python --out dist
          maturin sdist --out dist
          python -m twine check --strict dist/*
      - name: Check the installed release wheel
        run: |
          python -m venv .delta-oracle
          python -m venv .wheel-test
          .delta-oracle/bin/python -m pip install --index-url https://pypi.org/simple -r tests/delta/requirements.txt
          .wheel-test/bin/python -m pip install --index-url https://pypi.org/simple -r tests/delta/requirements.txt
          python tools/delta_check.py --group installed --candidate-env .wheel-test --wheel dist/*.whl --report evidence/installed.json
          .wheel-test/bin/python -I tools/wheel_smoke.py --require-macos-arm64-313
          .wheel-test/bin/python -I -m pip check
          python tools/delta_check.py --group all --oracle-env .delta-oracle --candidate-env .wheel-test --report evidence/delta.json
          python tools/delta_check.py --group existing --candidate-env .wheel-test --report evidence/existing.json
      - name: Upload only this run's distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download this run's distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Publish using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
