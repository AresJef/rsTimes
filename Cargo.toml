[package]
name = "rstimes"
version = "0.1.0+delta.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
include = ["Cargo.toml", "Cargo.lock", "rust/**", "src/rstimes/**", "LICENSE", "NOTICE", "pyproject.toml", "rust-toolchain.toml", "README.md"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

[dependencies]
pyo3 = { version = "=0.29.3" }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
