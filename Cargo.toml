[package]
name = "rstimes"
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
include = ["Cargo.toml", "Cargo.lock", "build.rs", "rust/**", "src/rstimes/**", "LICENSE", "NOTICE", "NOTICE-RUST-STDLIB.html", "NOTICE-CPYTHON.txt", "NOTICE-UNICODE.txt", "NOTICE-IANA-TIME-ZONE.txt", "NOTICE-PLDT-DEPENDENCIES.txt", "pyproject.toml", "rust-toolchain.toml", "README.md"]
readme = "README.md"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

[dependencies]
iana-time-zone = "=0.1.65"
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
tzdb_data = { version = "=0.2.5", default-features = false }
pyo3 = { version = "=0.29.3" }
polars = { version = "=0.55.1", default-features = false, features = ["dtype-datetime", "dtype-i128", "dtype-i8", "dtype-i16", "dtype-struct"] }
pyo3-polars = { version = "=0.28.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.154"

[build-dependencies]
pyo3-build-config = { version = "=0.29.3", features = ["resolve-config"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
