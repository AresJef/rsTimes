[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "rsTimes"
version = "0.1.0+delta.3"
description = "Rust-backed calendar deltas and Unix millisecond conversions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "NOTICE-RUST-STDLIB.html", "NOTICE-CPYTHON.txt"]
requires-python = ">=3.10"
dependencies = ["python-dateutil>=2.9", "numpy>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
# Authors and repository URLs await the maintainer's decision.

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "src"
module-name = "rstimes._native"
bindings = "pyo3"
features = ["extension-module"]
# Source metadata files must not pull same-named files from local/reference trees.
exclude = [".local/**", "reference/**", "target/**", "benchmarks/**", "tasks/**", "docs/**", "tests/**", "tools/**", "**/__pycache__/**", ".pytest_cache/**", ".git/**", "build/**", "dist/**", ".delta-oracle/**", ".wheel-test/**", ".venv/**", "htmlcov/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
