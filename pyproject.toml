[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "rsTimes"
version = "0.2.0b2"
description = "Rust-powered calendar deltas, configurable parsing, and scalar and pandas datetimes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "NOTICE-RUST-STDLIB.html", "NOTICE-CPYTHON.txt", "NOTICE-UNICODE.txt", "NOTICE-IANA-TIME-ZONE.txt", "NOTICE-PLDT-DEPENDENCIES.txt"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.3", "tzdata>=2026.5; sys_platform == 'win32'"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/AresJef/rsTimes"
Issues = "https://github.com/AresJef/rsTimes/issues"
Documentation = "https://github.com/AresJef/rsTimes#readme"

[project.optional-dependencies]
test = ["pytest>=8"]
dateutil = ["python-dateutil>=2.9"]
pandas = [
    "pandas>=2.3.3; python_version < '3.15' and (sys_platform != 'win32' or platform_machine != 'ARM64')",
    "pandas>=3.0.6; python_version >= '3.15' or (sys_platform == 'win32' and platform_machine == 'ARM64')",
]
polars = ["polars>=2.0.0"]

[tool.maturin]
python-source = "src"
module-name = "rstimes._native"
bindings = "pyo3"
features = ["extension-module"]
# Source metadata files must not pull same-named files from local/reference trees.
exclude = [".local/**", "reference/**", "target/**", "benchmarks/**", "tasks/**", "docs/**", "tests/**", "tools/**", "**/__pycache__/**", ".pytest_cache/**", ".git/**", "build/**", "dist/**", ".delta-oracle/**", ".wheel-test*/**", ".venv/**", "htmlcov/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
