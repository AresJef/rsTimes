[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "rsTimes"
version = "0.1.0+delta.1"
description = "Integer-based conversions between aware datetimes and Unix milliseconds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
# Authors and repository URLs await the maintainer's decision.

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
python-source = "src"
module-name = "rstimes._native"
bindings = "pyo3"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
